[project]
name = "deep-learning-pa1"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "albumentations>=2.0.8",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.5",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.11.0", "torchvision>=0.26.0"]
gpu = ["torch>=2.11.0", "torchvision>=0.26.0"]

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "gpu" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "gpu" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true